runs:
  using: composite
  steps:
    - name: Unblanked negation
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        ! loki start prd.md
    - name: Unblanked pipe
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        echo "$PRD_FILE" | loki start prd.md
    - name: Unblanked bare subshell
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        (loki start prd.md)
    - name: Unblanked brace group
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        { loki start prd.md; }
    - name: Blanked pipe
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        echo "$PRD_FILE" | loki start prd.md
