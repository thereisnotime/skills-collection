runs:
  using: composite
  steps:
    - name: Unblanked variable call
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        LOKI_BIN="$(command -v loki)"
        "$LOKI_BIN" start prd.md
    - name: Blanked variable call
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        LOKI_BIN="$(command -v loki)"
        "$LOKI_BIN" start prd.md
