runs:
  using: composite
  steps:
    - name: Unblanked other subcommand
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        loki review . --json
    - name: Blanked other subcommand
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        loki review . --json
