runs:
  using: composite
  steps:
    - name: Unblanked npx pinned version
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        npx loki-mode@1.2.3 start prd.md
    - name: Blanked npx pinned version
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        npx loki-mode@1.2.3 start prd.md
