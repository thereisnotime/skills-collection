runs:
  using: composite
  steps:
    - name: Unblanked if keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        if loki start prd.md; then echo pass; fi
    - name: Unblanked then keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        if true; then loki start prd.md; fi
    - name: Unblanked elif keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        if false; then echo a; elif loki start prd.md; then echo b; fi
    - name: Unblanked else keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        if false; then echo a; else loki start prd.md; fi
    - name: Unblanked while keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        while loki start prd.md; do sleep 1; done
    - name: Unblanked until keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        until loki start prd.md; do sleep 1; done
    - name: Unblanked do keyword
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        while true; do loki start prd.md; done
    - name: Unblanked if negation
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        if ! loki start prd.md; then echo failed; fi
    - name: Blanked if keyword
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        if loki start prd.md; then echo pass; fi
