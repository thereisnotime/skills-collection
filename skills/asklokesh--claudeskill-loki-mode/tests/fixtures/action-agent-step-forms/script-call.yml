runs:
  using: composite
  steps:
    - name: Unblanked script call
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        bash scripts/run-loki.sh
    - name: Blanked script call
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        ./scripts/run-loki.sh
