runs:
  using: composite
  steps:
    - name: Unblanked timeout wrapper
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        timeout 300 loki start prd.md
    - name: Unblanked env wrapper
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        env LOKI_PROVIDER=claude loki start prd.md
    - name: Unblanked nice wrapper
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        nice loki start prd.md
    - name: Unblanked command wrapper
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        command loki start prd.md
    - name: Unblanked exec wrapper
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        exec loki start prd.md
    - name: Blanked timeout wrapper
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        timeout 300 loki start prd.md
