runs:
  using: composite
  steps:
    - name: Unblanked absolute path call
      shell: bash
      env:
        GH_TOKEN: dummy-token
      run: |
        /usr/local/bin/loki start prd.md
    - name: Blanked absolute path call
      shell: bash
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GH_ENTERPRISE_TOKEN: ''
        GITHUB_ENTERPRISE_TOKEN: ''
      run: |
        /usr/local/bin/loki start prd.md
